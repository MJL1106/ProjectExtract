; Packaged-build texture budget.
;
; The cook uses the target platform's device profile to decide which mips to
; serialise, so capping MaxLODSize here strips the top mip at cook time without
; touching a single .uasset. Reverting is a one-line edit back to 16384.
;
; WindowsEditor inherits from Windows (BaseProfileName=Windows in
; BaseDeviceProfiles.ini), so the caps below are explicitly restored to the
; engine default in the editor profile -- the editor keeps full 4K.

[Windows DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)

[WindowsEditor DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
